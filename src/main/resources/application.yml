server:
  port: ${PORT:4000}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

leadfold:
  jwt-secret: ${JWT_SECRET}
  anthropic-api-key: ${ANTHROPIC_API_KEY}
  whatsapp-verify-token: ${WHATSAPP_VERIFY_TOKEN:}
